[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coindcx-paperbot"
version = "0.1.0"
description = "Phase-1 CoinDCX paper trading bot for Bratadeep (India-accessible, paper-only)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bratadeep" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
paperbot = "paperbot.cli:main"

[tool.setuptools.packages.find]
include = ["paperbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
